name: Frame.io S2S Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Frame.io S2S connection
        env:
          FRAMEIO_CLIENT_ID: ${{ secrets.FRAMEIO_CLIENT_ID }}
          FRAMEIO_CLIENT_SECRET: ${{ secrets.FRAMEIO_CLIENT_SECRET }}
        run: python src/frameio_connectivity.py
