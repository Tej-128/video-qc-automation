name: Monthly Monday Validation

on:
  workflow_dispatch:
    inputs:
      report_year:
        description: "Release year to validate"
        required: true
        default: "2026"
      report_month:
        description: "Release month number (1-12)"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate selected month from Monday
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          REPORT_YEAR: ${{ inputs.report_year }}
          REPORT_MONTH: ${{ inputs.report_month }}
        run: python src/monday_monthly_validation.py
