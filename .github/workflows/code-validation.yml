name: Code Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile streamlit_app.py src/*.py

      - name: Import production modules
        run: |
          python - <<'PY'
          from src.frameio_client import FrameIOClient
          from src.pipeline import run_pipeline
          from src.qc_classifier import classify_comments
          from src.report_generator import build_report
          print("Production modules imported successfully.")
          PY

      - name: Smoke-test Excel generation
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from io import BytesIO
          from src.frameio_client import Resolution
          from src.report_generator import build_report

          projects = [{
              "article_id": "71224",
              "item_name": "71224_Ronceret",
              "draft_script_sent": "2026-04-30",
              "date_video_released": "2026-08-16",
              "frameio_review_link": "https://f.io/example",
              "scriptwriter": "Writer A",
              "science_video_editor": "Editor A",
              "finishing_editor": "",
              "rough_editor": "",
          }]
          bundles = [{
              "project": projects[0],
              "resolution": Resolution(
                  status="resolved",
                  account_id="a",
                  project_id="p",
                  version_stack_id="v",
                  asset_name="71224_Ronceret_Preview",
                  method="smoke_test",
              ),
              "versions": [],
              "comments": [{
                  "article_id": "71224",
                  "version_number": 2,
                  "version_name": "71224_Ronceret_Preview_V2.mp4",
                  "comment_id": "c1",
                  "parent_comment_id": "",
                  "is_reply": False,
                  "commenter": "Reviewer",
                  "created_at": "2026-08-01T00:00:00Z",
                  "timestamp": "00:00:10:00",
                  "text": "Scientific name should be italicized.",
              }],
          }]
          errors = [{
              "article_id": "71224",
              "item_name": "71224_Ronceret",
              "date_video_released": "2026-08-16",
              "draft_script_sent": "2026-04-30",
              "frameio_review_link": "https://f.io/example",
              "resolution_method": "smoke_test",
              "asset_name": "71224_Ronceret_Preview",
              "version_number": 2,
              "version_name": "71224_Ronceret_Preview_V2.mp4",
              "comment_id": "c1",
              "parent_comment_id": "",
              "is_reply": False,
              "commenter": "Reviewer",
              "comment_created_at": "2026-08-01T00:00:00Z",
              "timecode": "00:00:10:00",
              "comment_text": "Scientific name should be italicized.",
              "issue_index": 1,
              "team": "scripting",
              "ai_category": "Scientific Formatting",
              "error_summary": "Italicize scientific name",
              "ai_error_count": 1,
              "confidence": 0.99,
              "needs_review": False,
              "classification_reason": "Scientific nomenclature formatting.",
              "ai_assignee": "Writer A",
              "scriptwriter": "Writer A",
              "science_video_editor": "Editor A",
              "finishing_editor": "",
              "rough_editor": "",
          }]

          for team in ("scripting", "video_editing"):
              payload = build_report(
                  team=team,
                  year=2026,
                  month=8,
                  projects=projects,
                  bundles=bundles,
                  error_rows=errors,
              )
              wb = load_workbook(BytesIO(payload), data_only=False)
              assert "Error Detail" in wb.sheetnames
              assert "Needs Review" in wb.sheetnames
              assert "Raw Frame.io Comments" in wb.sheetnames
              assert wb["Raw Frame.io Comments"].sheet_state == "hidden"

              if team == "scripting":
                  main = wb["QC by Draft Date"]
                  assert [main.cell(1, col).value for col in range(1, 13)] == [
                      "Article Number", "Writer", "Date Script Draft Sent",
                      "Language & Narration", "QC Comment",
                      "Titles & On-screen Text", "QC Comment",
                      "Scientific Accuracy & Completeness", "QC Comment",
                      "Scientific Formatting", "QC Comment", "Total Errors",
                  ]
                  assert main["A2"].value == "71224_Ronceret"
                  assert main["J2"].value == 1
                  assert main["K2"].value == "Italicize scientific name"
                  assert wb["Monthly Trend"]["A2"].value == "2026-04"
                  assert len(wb["Monthly Trend"]._charts) == 1
                  assert "Writer Monthly Trend" in wb.sheetnames
              else:
                  desc = wb["Description"]
                  assert desc["A2"].value == "Audio/Visual"
                  assert desc["B2"].value == "Sound glitch, video glitch, blurry footage, footage pacing"
          print("Excel smoke test passed.")
          PY
